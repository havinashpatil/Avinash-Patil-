services:
  # Backend API Service
  - type: web
    name: bloodsense-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        value: mongodb://localhost:27017/bloodsense
      - key: FLASK_ENV
        value: production
    
  # Frontend Static Site
  - type: web
    name: bloodsense-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
